services:
  - type: web
    name: animal-chess
    runtime: node
    plan: starter
    region: singapore
    # CI gates the deploy: GitHub Actions calls the deploy hook only after
    # lint/typecheck/test/build pass on main. Keep Render's own auto-deploy off.
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    # Profiles persist to apps/web/.data/profiles.json (file-backed, not a DB).
    # Without a disk this resets on every deploy/restart.
    disk:
      name: data
      mountPath: /opt/render/project/src/apps/web/.data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Set after first deploy to the service's public URL, e.g.
      # https://animal-chess.onrender.com  (NextAuth requires the exact origin).
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
